name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Stop the deploy if a Stripe secret ever lands in the repository (values are not printed).
      - name: Check for committed secrets
        run: |
          if git ls-files | grep -qE '(^|/)\.dev\.vars$'; then echo "::error::.dev.vars is committed"; exit 1; fi
          if git grep -qE '(sk|rk)_(test|live)_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}'; then echo "::error::A Stripe secret appears in the repository"; exit 1; fi

      # Snipcart checks prices against this page; rebuild it from products.json so
      # a price edited in /admin can never disagree with it. Fails the deploy on bad data.
      - name: Build Snipcart price catalog
        run: node tools/build-snipcart-catalog.mjs

      # Creates/updates the orders tables in D1 before the new code goes live. Needs the D1 database id in
      # wrangler.toml and an API token with D1 edit permission. Migrations only add; they never delete orders.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply lacci-orders --remote

      - name: Publish with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
