# Cloudflare Worker "laccistudio": serves the static site and, since the Stripe migration,
# the /api/ checkout routes in worker/index.js. Files are served before the worker runs, so
# ordinary page views never use a worker request.
name = "laccistudio"
main = "worker/index.js"
compatibility_date = "2026-07-21"

[assets]
directory = "./"
binding = "ASSETS"

# Orders database (Cloudflare D1, free plan). Create it once in the Cloudflare dashboard
# (Workers & Pages -> D1 -> Create, name "lacci-orders"), paste its id below, then run the
# migration in migrations/ (see docs/COMMERCE.md).
[[d1_databases]]
binding = "DB"
database_name = "lacci-orders"
database_id = "300514d1-f136-4aa9-97fc-e870984412de"
migrations_dir = "migrations"

[vars]
SITE_URL = "https://laccistudio.com"
ADMIN_GITHUB_REPO = "rtrtssn4cn-hue/laccistudio-web"
UPLOAD_HOSTS = "51niy1s3e7.ucarecd.net,ucarecdn.com"
EMAIL_API_URL = "https://api.resend.com/emails"
ORDER_EMAIL_FROM = "Lacci Studio <orders@laccistudio.com>"
# Owner decision 2026-09-26: Stripe Tax, Texas registration only, shipping taxable where required.
# "none" is for engineering tests only.
TAX_MODE = "stripe_tax"

# Secrets (set in the Cloudflare dashboard, never in this file):
#   STRIPE_SECRET_KEY      sk_test_... while testing, sk_live_... after approval
#   STRIPE_WEBHOOK_SECRET  whsec_... from the Stripe webhook endpoint
#   ORDER_LINK_SECRET      random value of at least 32 bytes for private customer links
#   EMAIL_API_KEY          credential for the transactional email endpoint
