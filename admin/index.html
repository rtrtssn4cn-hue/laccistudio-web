<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Lacci Studio — Content Editor</title>
<link rel="manifest" href="/admin/admin.webmanifest">
<link rel="apple-touch-icon" href="/assets/logo/admin-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lacci Admin">
</head>
<body>
  <!-- Back to the new Lacci Admin: a button on this page, and straight back after logging in from there -->
  <a id="to-studio" href="/admin/studio/" style="position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:99999;background:#D79D41;color:#25140F;font:600 14px/1 -apple-system,Segoe UI,sans-serif;padding:12px 16px;border-radius:99px;text-decoration:none;box-shadow:0 6px 18px -8px rgba(0,0,0,.45)">Open Lacci Admin →</a>
  <script>
    (function () {
      if (new URLSearchParams(location.search).get("next") !== "studio") return;
      var t = setInterval(function () {
        try { var u = JSON.parse(localStorage.getItem("decap-cms-user") || "null"); if (u && u.token) { clearInterval(t); location.replace("/admin/studio/"); } } catch (e) {}
      }, 500);
    })();
  </script>
  <!-- Login is handled by GitHub through the OAuth worker set in config.yml (base_url) -->
  <!-- The visual editor (Decap CMS) -->
  <!-- Pinned: a floating version could change the editor without warning. Update the version and hash together. -->
  <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js" integrity="sha384-A/Gdn928CNLufmnGWGs9RM4Q9o8bSNLeJERqBFrBjwzL7FRpoLT3MPF8Tl0+Wd2p" crossorigin="anonymous"></script>
</body>
</html>
