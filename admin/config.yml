# Logs in through GitHub (we left Netlify). Fill in your repo + OAuth worker below.
backend:
  name: github
  repo: rtrtssn4cn-hue/laccistudio-web
  branch: main
  base_url: https://lacci-oauth.pupsride.workers.dev   # your OAuth login worker

media_folder: "assets/img"
public_folder: "/assets/img"

site_url: https://laccistudio.com
display_url: https://laccistudio.com
logo_url: /assets/logo/lacci-primary.png

collections:
  # ---------------- Products & prices ----------------
  - name: "shop"
    label: "Shop — Products & Prices"
    files:
      - name: "products"
        label: "All Products"
        file: "content/products.json"
        description: "Add, edit, reorder, or remove products. Drag rows to reorder."
        fields:
          - name: "products"
            label: "Products"
            label_singular: "Product"
            widget: "list"
            summary: "{{fields.name}} — ${{fields.price}}"
            fields:
              - { name: "name", label: "Product name", widget: "string" }
              - { name: "price", label: "Price ($)", widget: "number", value_type: "float", min: 0, hint: "Base price. If you use per-choice prices below, this is the lowest ('from') price." }
              - name: "images"
                label: "Photos (slideshow)"
                widget: "list"
                required: false
                field: { name: "image", label: "Photo", widget: "image" }
                hint: "Add several photos — customers swipe through them like Etsy. First one is the main image."
              - { name: "video", label: "Short video (optional, mp4 ≈8s)", widget: "file", required: false, hint: "Optional product video that plays as the last slide." }
              - { name: "category", label: "Category", widget: "string", hint: "Type your own — e.g. Drinkware, Apparel, Gifts. This makes the filter buttons. Spell it the same across products to group them." }
              - { name: "subcategory", label: "Subcategory (optional)", widget: "string", required: false, hint: "Optional second-level filter, e.g. Tumblers under Drinkware. Appears after you click its category." }
              - { name: "description", label: "Short description", widget: "text" }
              - { name: "optionLabel", label: "Options label", widget: "string", required: false, hint: "e.g. Size, Color, Item. Leave blank if the product has no choices." }
              - name: "choices"
                label: "Choices (size / color / item)"
                widget: "list"
                required: false
                summary: "{{fields.name}}{{#if fields.price}} — ${{fields.price}}{{/if}}"
                fields:
                  - { name: "name", label: "Choice", widget: "string" }
                  - { name: "price", label: "Price for this choice ($)", widget: "number", value_type: "float", required: false, min: 0, hint: "Leave blank to use the product's base price." }
              - { name: "id", label: "Internal ID (leave as-is)", widget: "string", hint: "Unique tag used behind the scenes — don't change on existing products." }
              - { name: "weight", label: "Shipping weight (grams)", widget: "number", value_type: "int", required: false, hint: "Product + packaging, in grams. Snipcart multiplies this by quantity to pick the shipping rate. 1 oz = 28g." }

  # ---------------- Gallery (Our Work) ----------------
  - name: "gallery"
    label: "Gallery — Our Work"
    files:
      - name: "gallery"
        label: "Gallery"
        file: "content/gallery.json"
        description: "Photos of your finished work. Add, remove, reorder, and caption them."
        fields:
          - { name: "intro", label: "Intro sentence", widget: "text" }
          - name: "items"
            label: "Photos"
            label_singular: "Photo"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - name: "images"
                label: "Photos (first one = cover — add as many as you like)"
                widget: "list"
                required: false
                field: { name: "image", label: "Photo", widget: "image" }
                hint: "Drag to reorder. The first photo is the cover; the rest become a slideshow."
              - { name: "video", label: "Video (optional, mp4 under 25MB)", widget: "file", required: false, hint: "Plays as the last slide." }
              - { name: "category", label: "Category (type your own — becomes a filter button)", widget: "string", required: false, hint: "e.g. Drinkware. Spell it the same across items so they group under one button." }
              - { name: "subcategory", label: "Subcategory (optional — becomes a sub-filter)", widget: "string", required: false, hint: "e.g. Tumblers. Appears after you click its category." }
              - { name: "caption", label: "Caption", widget: "string", required: false }

  # ---------------- Homepage text ----------------
  - name: "homepage"
    label: "Homepage Text"
    files:
      - name: "home"
        label: "Homepage"
        file: "content/home.json"
        fields:
          - { name: "heroBadge", label: "Top badge", widget: "string" }
          - { name: "heroTitleLine1", label: "Headline — line 1", widget: "string" }
          - { name: "heroTitleLine2", label: "Headline — line 2 (gold)", widget: "string" }
          - { name: "heroLead", label: "Intro sentence under headline", widget: "text" }
          - { name: "heroQuote", label: "Quote on the logo card", widget: "string" }
          - { name: "introTitle", label: "Welcome section — title", widget: "string" }
          - { name: "introText", label: "Welcome section — paragraph", widget: "text" }

  # ---------------- Contact & settings ----------------
  - name: "settings"
    label: "Contact & Settings"
    files:
      - name: "contact"
        label: "Contact, Hours, Social & Payments"
        file: "content/settings.json"
        fields:
          - { name: "saleBannerOn", label: "SALE BANNER — show it?", widget: "boolean", default: false, required: false }
          - { name: "saleBannerSize", label: "Banner size", widget: "select", options: ["strip", "large"], default: "strip", required: false, hint: "strip = thin bar across the top. large = full announcement block, same height as a page header." }
          - { name: "saleBannerEyebrow", label: "Small line above the headline (large only)", widget: "string", required: false, hint: "e.g. LIMITED TIME" }
          - { name: "saleBanner", label: "Banner text", widget: "string", required: false, hint: "e.g. Summer Sale — 55% off all drinkware" }
          - { name: "saleBannerSubtext", label: "Supporting line under the headline (large only)", widget: "text", required: false, hint: "One or two sentences." }
          - { name: "saleBannerShortText", label: "Short text for other pages", widget: "string", required: false, hint: "The large banner only shows on the homepage. Every other page gets a slim bar using this line \u2014 e.g. 55% off sitewide. Blank = uses the banner text above." }
          - { name: "saleBannerCode", label: "Promo code (customers click to copy)", widget: "string", required: false, hint: "Must match a discount you created in Snipcart." }
          - { name: "saleBannerImage", label: "Banner background image (optional)", widget: "image", required: false, hint: "Fills the whole banner. Wide, short shapes work best." }
          - { name: "saleBannerImageStyle", label: "How to use the image", widget: "select", options: ["tint", "photo", "only"], default: "tint", required: false, hint: "tint = image softened behind the banner colour. photo = image fills the banner, text goes white. only = just your artwork, no colour and no overlay text." }
          - { name: "saleBannerLinkText", label: "Button text (optional)", widget: "string", required: false, hint: "e.g. Shop now" }
          - { name: "saleBannerLink", label: "Button link (optional)", widget: "string", required: false, hint: "e.g. shop.html" }
          - { name: "saleBannerStart", label: "Start date (optional)", widget: "string", required: false, hint: "YYYY-MM-DD. Blank = start now." }
          - { name: "saleBannerEnd", label: "End date (optional)", widget: "string", required: false, hint: "YYYY-MM-DD. Banner hides itself after this date." }
          - { name: "saleBannerTheme", label: "Banner colour", widget: "select", options: ["gold", "walnut", "espresso", "sandstone", "linen", "ivory"], default: "gold", required: false, hint: "Lacci brand palette: gold #D79D41, walnut #1F1610, espresso #25140F, sandstone #D7CBBE, linen #E9DFD1, ivory #F4ECE5. Ignored when image style is photo or only." }
          - { name: "saleBannerDismissible", label: "Let visitors close it", widget: "boolean", default: true, required: false }
          - { name: "email", label: "Business email", widget: "string" }
          - { name: "phone", label: "Phone (leave blank to hide)", widget: "string", required: false }
          - { name: "instagram", label: "Instagram link (blank to hide)", widget: "string", required: false }
          - { name: "facebook", label: "Facebook link (blank to hide)", widget: "string", required: false }
          - { name: "etsy", label: "Etsy link (blank to hide)", widget: "string", required: false }
          - { name: "tiktok", label: "TikTok (blank to hide)", widget: "string", required: false, hint: "Handle or full link \u2014 e.g. @laccistudio" }
          - { name: "pinterest", label: "Pinterest (blank to hide)", widget: "string", required: false, hint: "Username or full link" }
          - { name: "youtube", label: "YouTube (blank to hide)", widget: "string", required: false, hint: "Handle or full link \u2014 e.g. @laccistudio" }
          - { name: "checkoutMode", label: "Checkout mode", widget: "select", options: ["inquiry", "paypal", "snipcart"], default: "inquiry", hint: "'inquiry' emails you the order. 'paypal' or 'snipcart' take card payments (fill the key below)." }
          - { name: "orderEmail", label: "Where orders are emailed", widget: "string" }
          - { name: "paypalClientId", label: "PayPal Client ID (for paypal mode)", widget: "string", required: false }
          - { name: "snipcartApiKey", label: "Snipcart public key (for snipcart mode)", widget: "string", required: false }
          - { name: "uploadEndpoint", label: "Design upload endpoint (optional Formspree URL)", widget: "string", required: false }
